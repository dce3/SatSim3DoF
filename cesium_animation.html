      viewer.clock.multiplier = 50;

      viewer.clock.onTick.addEventListener(function(clock) {

        const pos = orbitPositions[currentIndex];
        spacecraft.position = Cesium.Cartesian3.fromDegrees(pos[0], pos[1], pos[2]);
